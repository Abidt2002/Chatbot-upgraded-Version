<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Devbay AI — Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Floating icon -->
  <div id="chatbot-icon" title="Open Devbay AI" onclick="toggleChat()">
    💬
  </div>

  <!-- Chat window -->
  <div id="chatbot-window" class="hidden">
    <div id="chatbot-header">
      <div id="brand">
        <!-- Replace logo.png with your Devbay logo file in repo (or absolute URL) -->
        <img id="brand-logo" src="logo.png" alt="Devbay" onerror="this.style.display='none'"/>
        <div id="brand-text">
          <div id="brand-title">Devbay AI Assistant</div>
          <div id="brand-sub">Ask about Devbay or anything else</div>
        </div>
      </div>

      <div id="header-controls">
        <button id="darkToggle" onclick="toggleDark()">🌓</button>
        <button id="exportCsv" title="Export chat as CSV" onclick="exportCSV()">⬇ CSV</button>
        <button id="closeBtn" onclick="toggleChat()">✖</button>
      </div>
    </div>

    <div id="suggestions" class="suggestions"></div>

    <div id="chatbox" role="log" aria-live="polite"></div>

    <div id="input-row">
      <input id="userInput" type="text" placeholder="Ask something... (Enter to send)" autocomplete="off"/>
      <button id="sendBtn" onclick="onSend()">➤</button>
      <button id="micBtn" onclick="startSpeech()">🎤</button>
    </div>

    <div id="footer-note">Model: GPT-style • Typing animation enabled</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
