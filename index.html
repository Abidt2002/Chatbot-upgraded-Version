<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devbay AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Floating Chat Icon -->
<div id="chatbot-icon" onclick="toggleChat()">💬</div>

<!-- Chatbot Window -->
<div id="chatbot-window" class="hidden">
  <div id="chatbot-header">
    <div id="brand-title">Devbay AI Assistant</div>
    <div id="header-controls">
      <button onclick="toggleDark()">🌓</button>
      <button onclick="exportCSV()">⬇ CSV</button>
      <button onclick="toggleChat()">✖</button>
    </div>
  </div>

  <div id="suggestions" class="suggestions"></div>
  <div id="chatbox"></div>

  <div id="input-row">
    <input id="userInput" type="text" placeholder="Ask something..." autocomplete="off">
    <button onclick="onSend()">➤</button>
  </div>

  <div id="footer-note">Model: GPT-style • Typing animation • RAG Semantic Search</div>
</div>

<script src="script.js"></script>
</body>
</html>
